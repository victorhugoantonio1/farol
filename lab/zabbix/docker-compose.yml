# Zabbix 7.0 LTS local, só pra testar o Farol.
# Sobe com:   docker compose up -d
# Frontend:   http://localhost:8080   (Admin / zabbix)
# Derruba:    docker compose down      (some com os dados: docker compose down -v)

name: farol-lab-zabbix

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix-lab
      POSTGRES_DB: zabbix
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zabbix -d zabbix']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.0-latest
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix-lab
      POSTGRES_DB: zabbix
      ZBX_CACHEUPDATEFREQUENCY: 10 # enxerga itens novos em até 10s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.0-latest
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: postgres
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix-lab
      POSTGRES_DB: zabbix
      PHP_TZ: America/Sao_Paulo
    ports:
      - '127.0.0.1:8080:8080' # só na sua máquina, não expõe na rede
    depends_on:
      - zabbix-server
    restart: unless-stopped

volumes:
  pgdata:
