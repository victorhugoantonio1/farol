# Gera o instalador do Windows quando você cria uma tag (ex.: git tag v0.1.0 && git push --tags)
# e anexa o .exe a um Release do GitHub. Assim qualquer pessoa vê que o binário
# saiu deste código, e não de uma máquina qualquer.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npx electron-builder --win --publish never

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist/*.exe | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Out-File -Encoding ascii dist/SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            **TopWatch-Setup.exe**: instalador. Instala só pro seu usuário (não pede administrador), cria atalho e já abre o app.
            **TopWatch-Portable.exe**: roda direto, sem instalar.

            O instalador não é assinado digitalmente: no aviso do SmartScreen, clique em **Mais informações → Executar assim mesmo**.
            Confira o arquivo com o `SHA256SUMS.txt`.
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt
