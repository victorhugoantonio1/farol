# Gera o instalador do Windows e anexa os .exe a um Release do GitHub.
# Roda quando você cria uma tag (git tag v0.1.0 && git push --tags) ou pelo botão
# "Run workflow" em Actions → release (aí a versão vem do package.json). Assim qualquer pessoa vê que o binário
# saiu deste código, e não de uma máquina qualquer.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Versão
        id: v
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          "tag=v$v" >> $env:GITHUB_OUTPUT

      - run: npm ci
      - run: npm test
      - run: npx electron-builder --win --publish never

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist/*.exe, dist/*.msi | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Out-File -Encoding ascii dist/SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            **TopWatch-Setup.exe**: instalador. Instala só pro seu usuário (não pede administrador), cria atalho e já abre o app.
            **TopWatch-Portable.exe**: roda direto, sem instalar.
            **TopWatch.msi**: para a TI. Instala para todos os usuários em Arquivos de Programas; dá para distribuir pelo Intune ou GPO (`msiexec /i TopWatch.msi /qn`).

            O instalador não é assinado digitalmente: no aviso do SmartScreen, clique em **Mais informações → Executar assim mesmo**.
            Confira o arquivo com o `SHA256SUMS.txt`.
          files: |
            dist/*.exe
            dist/*.msi
            dist/SHA256SUMS.txt
